{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <nav class="nav-bar">
    <a href="{% url 'home' %}">Home</a>

    <!-- FIXED: These must NOT navigate away -->
    <a href="#" id="navLogin">Sign In</a>
    <a href="#" id="navRegister">Register</a>
  </nav>
  
  <section class="auth-container">

    <!-- Login panel -->
    <div id="loginPanel" class="auth-panel">
      <h2>Sign In</h2>
      <form id="loginForm" method="post">
        {% csrf_token %}
        <label>Email</label>
        <input type="email" id="loginEmail" name="email" required>

        <label>Password</label>
        <input type="password" id="loginPassword" name="password" required>

        <button type="submit">Sign In</button>
      </form>

      <p><a href="#" id="linkForgot">Forgot your password?</a></p>
    </div>

    <!-- Register panel -->
    <div id="registerPanel" class="auth-panel hidden">
      <h2>Create Account</h2>
      <form id="registerForm" method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" id="regUsername" name="username" required>

        <label>Email</label>
        <input type="email" id="regEmail" name="email" required>

        <label>Password</label>
        <input type="password" id="regPassword" name="password" required>

        <button type="submit">Register</button>
      </form>
    </div>

    <!-- Forgot password panel -->
    <div id="forgotPanel" class="auth-panel hidden">
      <h2>Reset Password</h2>
      <form id="forgotForm" method="post">
        {% csrf_token %}
        <label>Email</label>
        <input type="email" id="forgotEmail" name="email" required>

        <button type="submit">Send Reset Link</button>
      </form>

      <p><a href="#" id="backToLogin">Back to login</a></p>
    </div>

    <!-- Reset password panel -->
    <div id="resetPanel" class="auth-panel hidden">
      <h2>Set New Password</h2>
      <form id="resetForm" method="post">
        {% csrf_token %}
        <label>New Password</label>
        <input type="password" id="newPassword" name="password" required>

        <button type="submit">Update Password</button>
      </form>
    </div>

  </section>

  <script src="{% static 'js/javascript.js' %}"></script>

</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Books</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="sakura-bg">

    <nav class="nav-bar soft-nav">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'library' %}">Library</a>
        <a href="{% url 'search' %}" class="active-link">Search</a>
    </nav>

    <section class="search-container soft-card">
        <h2 class="panel-title">Search Your Library</h2>

        <!-- GET method puts the search query 'q' into the URL -->
        <form id="searchForm" class="search-form" method="GET" action="{% url 'search' %}">
            <input 
                type="text" 
                name="q" 
                class="search-input" 
                placeholder="Search by title or author..."
                value="{{ query|default:'' }}"
                required
            >
            <button type="submit" class="btn-sakura">Search</button>
        </form>

        <div id="searchResults" class="results-area">
            {% if query %}
                <!-- Renders results only if a query has been submitted -->
                {% for book in books %}
                    <div class="book-card soft-card">
                        <h3>{{ book.title }}</h3>
                        <p>{{ book.author }}</p>
                        <a href="{% url 'book_details' book.id %}" class="btn-sakura">Details</a>
                    </div>
                {% empty %}
                    <p>No matches found.</p>
                {% endfor %}
            {% endif %}
        </div>
    </section>

</body>
</html>

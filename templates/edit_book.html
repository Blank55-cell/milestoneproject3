{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit: {{ book.title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>


<body class="sakura-bg">

    <nav class="nav-bar">
        <ul class="nav-list" style="display: flex; list-style: none; margin: 0; padding: 0; gap: 1rem;">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'book_details' book.id %}">Back to Details</a></li>
        </ul>  
    </nav>

    <section class="soft-card">
        <h2 class="panel-title">Edit Book Details</h2>
        
        <form method="POST" class="petal-card auth-form">
            {% csrf_token %}
            
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ book.title }}" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" value="{{ book.author }}" required>

            <label for="status">Reading Status</label>
            <select id="status" name="status" class="edit-select">
                <option value="Want to Read" {% if book.status == "Want to Read" %}selected{% endif %}>Want to Read</option>
                <option value="Reading" {% if book.status == "Reading" %}selected{% endif %}>Reading</option>
                <option value="Completed" {% if book.status == "Completed" %}selected{% endif %}>Completed</option>
            </select>

            <label for="chapter">Favourite Chapter</label>
            <input type="text" id="chapter" name="chapter" value="{{ book.favourite_chapter }}">

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="6" class="edit-textarea">{{ book.notes }}</textarea>

            <div class="edit-actions">
                <button type="submit" class="btn-sakura">Save Changes</button>
                <a href="{% url 'book_details' book.id %}" class="btn-outline edit-cancel-btn">Cancel</a>
            </div>
        </form>
    </section>

    <script src="{% static 'js/javascript.js' %}"></script>
</body>
</html>
